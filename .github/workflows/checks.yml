name: checks

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: every job reads the repository and nothing else, unless it says otherwise.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits through the API on pull_request events.
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  em-dashes:
    name: No em dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan tracked files for U+2014
        run: |
          set -e
          hits=$(git ls-files -z \
            | grep -zv -E '^(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$' \
            | grep -zv -E '^(public/demo/|fixtures/raw/|fixtures/[^/]+\.json$)' \
            | xargs -0 grep -nI $'\xE2\x80\x94' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Em dashes found. Replace with a comma, period, colon, parentheses, or a hyphen:"
            echo "$hits"
            exit 1
          fi
          echo "No em dashes."
      - name: Scan commit messages for U+2014
        if: github.event_name == 'push'
        run: |
          range="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then range="${{ github.sha }}"; fi
          git fetch --deepen=50 >/dev/null 2>&1 || true
          if git log --format=%B "$range" 2>/dev/null | grep -q $'\xE2\x80\x94'; then
            echo "Em dash found in a commit message in this push."
            exit 1
          fi

  local-files:
    name: Local-only files not committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Block CLAUDE.md, .claude/, .mcp.json, .env files
        run: |
          bad=$(git ls-files | grep -E '(^|/)CLAUDE\.md$|^\.claude/|^\.mcp\.json$|(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "These files must stay local:"
            echo "$bad"
            exit 1
          fi

  build:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the Qloo data scan checks every file version the public mirror would publish.
          fetch-depth: 0
          # Nothing here fetches or pushes, so installed packages never see a token.
          persist-credentials: false
      - name: Check for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet, skipping."; fi
      # The public mirror leaves out Qloo response data (public-mirror.exclude), so there the tests that
      # replay recordings skip themselves, and next build (which needs the stored examples) is skipped.
      - name: Detect the public mirror
        id: mode
        if: steps.pkg.outputs.exists == 'true'
        run: |
          if [ -f fixtures/smoke.json ] && [ -d data/runs ]; then
            echo "public=false" >> "$GITHUB_OUTPUT"
          else
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Public mirror::Recorded Qloo data is not in this repository (README.md, Data and the Qloo API). Running typecheck, lint, the unit tests that need no recordings, the em dash and doc-name scan, and check:public. Skipping next build and e2e, which need the recordings."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.pkg.outputs.exists == 'true'
        run: npm ci
      - if: steps.pkg.outputs.exists == 'true'
        run: npm run check
      - name: No Qloo data in the public tree or its history
        if: steps.mode.outputs.public == 'true'
        run: npm run check:public -- --history
      # In the working repository: fail early when a kept file (one the mirror publishes) holds Qloo
      # data, instead of when main is mirrored.
      - name: No Qloo data in what the public mirror would publish
        if: steps.mode.outputs.public == 'false'
        run: node scripts/public-mirror.mjs scan --names-from fixtures
      # Cache Components and prerender errors only show up in a build. Replay mode, no secrets.
      - if: steps.mode.outputs.public == 'false'
        name: Build
        run: npx next build
        env:
          STOOP_LIVE: "false"
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (replay)
    # Pull requests and main. A push to a branch with an open pull request runs it once, on the pull request.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push to the same pull request cancels the run in progress; a running main job is never cancelled.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Replay mode and no secrets: no live Qloo, Claude or fal call, and the in-memory store.
    env:
      STOOP_LIVE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PORT: "3215"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The build job's check: the public mirror has no recorded Qloo data, so its e2e run skips.
      - name: Detect the public mirror
        id: mode
        run: |
          if [ -f fixtures/smoke.json ] && [ -d data/runs ]; then
            echo "public=false" >> "$GITHUB_OUTPUT"
          else
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Public mirror::Recorded Qloo data is not in this repository (README.md, Data and the Qloo API), so the end-to-end tests are skipped."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.mode.outputs.public == 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.mode.outputs.public == 'false'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.mode.outputs.public == 'false'
        run: npx playwright install --with-deps chromium
      - name: Build
        if: steps.mode.outputs.public == 'false'
        run: npx next build
      - name: Start the server
        if: steps.mode.outputs.public == 'false'
        run: |
          nohup npx next start -p "$E2E_PORT" > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://localhost:$E2E_PORT/"; then
              echo "next start is answering on port $E2E_PORT."
              exit 0
            fi
            sleep 1
          done
          echo "::error::next start did not answer on port $E2E_PORT within 60 s."
          cat "$RUNNER_TEMP/next-start.log"
          exit 1
      - name: End-to-end tests
        if: steps.mode.outputs.public == 'false'
        run: E2E_BASE_URL="http://localhost:$E2E_PORT" npm run e2e
      - name: Server log
        if: failure() && steps.mode.outputs.public == 'false'
        run: cat "$RUNNER_TEMP/next-start.log" || true
      - name: Upload the Playwright report
        if: failure() && steps.mode.outputs.public == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
